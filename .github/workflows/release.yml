name: Release

# Tag-driven publish: push a `v*.*.*` tag → build, verify, publish with provenance.
# Manual `npm publish` is blocked by package.json prepublishOnly.
#
# Auth (pick ONE — see docs/PUBLISHING.md):
#
#   A) npm Trusted Publishing (OIDC, preferred, no long-lived token)
#      - On npmjs.com configure this repo + workflow as trusted publisher
#      - Leave NPM_TOKEN unset (or delete the secret)
#      - Requires id-token: write + npm >= 11.5.1
#      - Do NOT leave an empty NODE_AUTH_TOKEN / _authToken= in .npmrc
#        (that blocks OIDC — see actions/setup-node#1551)
#
#   B) Classic Automation token in secrets.NPM_TOKEN
#      - Must be Classic → Automation (bypasses 2FA)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      # No registry-url: empty _authToken breaks OIDC trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package.json version matches tag
        run: |
          TAG="${{ steps.ver.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag version:    $TAG"
          echo "package.json:   $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "✖ version drift: tag '$TAG' != package.json '$PKG'"
            echo "Fix: npm version $TAG -m 'release: %s' && git push origin master --follow-tags"
            exit 1
          fi
          echo "✓ versions in sync"

      - name: Publish to npm (with provenance)
        env:
          NPM_TOKEN_SECRET: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${NPM_TOKEN_SECRET:-}" ]; then
            echo "Auth mode: NPM_TOKEN (Classic Automation expected; OTP-bound tokens fail with EOTP)"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN_SECRET}" > "${RUNNER_TEMP}/.npmrc"
            export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          else
            echo "Auth mode: OIDC trusted publishing (no NPM_TOKEN secret)"
            echo "Ensure npmjs.com → package → Trusted Publisher lists:"
            echo "  repository: pungggi/pi-schedule"
            echo "  workflow:   release.yml"
            unset NODE_AUTH_TOKEN || true
            unset NPM_TOKEN || true
          fi

          npm publish --access public --provenance
