name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Guard the published tarball. pi-schedule ships raw .ts source (pi loads
      # .ts extensions at runtime — no build step). The `files` allowlist in
      # package.json is authoritative; this verifies nothing stray leaks in.
      - name: Verify packed tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          # No tests, coverage, scripts, or dev-only files should ship.
          ! grep -E '\b(test/|coverage/|scripts/|\.github/|vitest\.config)' pack.log
          # The extension entry + skill must be present (the actual payload).
          grep -E 'src/extension\.ts' pack.log
          grep -E 'skills/schedule/SKILL\.md' pack.log
          grep -E 'docs/RELIABILITY\.md' pack.log
